services:
  - type: web
    name: whatsflow
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node scripts/render-start.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: WHATSFLOW_WORKER_PORT
        value: "3101"
      - key: WHATSFLOW_WORKER_URL
        value: http://127.0.0.1:3101
      - key: WHATSFLOW_WORKER_SECRET
        generateValue: true
      - key: SESSIONS_DIR
        value: /opt/render/project/sessions
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: WHATSFLOW_OWNER_EMAILS
        sync: false
    disk:
      name: whatsflow-sessions
      mountPath: /opt/render/project/sessions
      sizeGB: 5
